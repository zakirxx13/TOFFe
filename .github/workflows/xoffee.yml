name: X

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - run: pip install playwright && playwright install chromium
        
    - name: X
      env:
        Z: ${{ secrets.ZOFFE_PASS }}
      run: |
        python3 -c "import zipfile,os;zipfile.ZipFile('XoFFe.zip','r').extractall(pwd=os.environ['Z'].encode())"
        python3 xoffee.py
        
    - run: |
        git config user.name "X" && git config user.email "x@x.com"
        git add XoFFE_NS.m3u XoFEE_OT.m3u 2>/dev/null || true
        git diff --staged --quiet || (git commit -m "X $(date +%s)" && git push)
