name: ZoFFE M3U Generator

on:
  schedule:
    - cron: '0 * * * *'  # প্রতি ঘণ্টায়
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        pip install playwright
        playwright install chromium
        
    - name: Run ZoFFE Generator
      env:
        ZOFFE_PASS: ${{ secrets.ZOFFE_PASS }}
      run: python zoffe_generator.py
        
    - name: Check for new files
      id: check
      run: |
        git add -A
        if git diff --staged --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit and Push
      if: steps.check.outputs.changed == 'true'
      run: |
        git config user.name "ZoFFE Bot"
        git config user.email "zoffe@github.com"
        git commit -m "🔄 Update M3U playlists - $(date '+%Y-%m-%d %H:%M')
        
        - Auto-generated by ZoFFE Generator
        - Channels: $(grep -c 'EXTINF' XoFFE_NS.m3u || echo '0')
        - Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
        git push
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zoffe-playlists-${{ github.run_id }}
        path: |
          XoFFE_NS.m3u
          XoFEE_OT.m3u
          cookie_update.log
          
    - name: Summary
      run: |
        echo "## 🎯 ZoFFE Generation Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f "XoFFE_NS.m3u" ]; then
          channels=$(grep -c 'EXTINF' XoFFE_NS.m3u || echo "0")
          echo "- 📺 Channels: $channels" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- ⏰ Time: $(date)" >> $GITHUB_STEP_SUMMARY
